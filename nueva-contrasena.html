<body data-pagina="nueva-contrasena">
  <main id="contenido" tabindex="-1">
    <section class="acceso" aria-labelledby="titulo-nueva">
      <div class="contenedor acceso__contenedor">
        <div class="acceso__caja" data-caja>
          <p class="etiqueta">Alumnas</p>
          <h1 id="titulo-nueva" tabindex="-1">Crea tu nueva contraseña</h1>
          <p class="acceso__intro" data-intro>Comprobando tu enlace…</p>

          <form class="formulario" novalidate data-nueva hidden>
            <div class="campo">
              <label class="campo__etiqueta" for="nueva-contrasena">Contraseña nueva</label>
              <div class="campo__grupo">
                <input class="campo__control" id="nueva-contrasena" name="contrasena" type="password" autocomplete="new-password" required aria-describedby="nueva-contrasena-ayuda nueva-contrasena-error">
                <button class="campo__ojo" type="button" data-mostrar-contrasena="nueva-contrasena"></button>
              </div>
              <p class="campo__ayuda" id="nueva-contrasena-ayuda">Mínimo 8 caracteres.</p>
              <p class="campo__error" id="nueva-contrasena-error" hidden></p>
            </div>
            <div class="campo">
              <label class="campo__etiqueta" for="nueva-confirmar">Confirmar contraseña</label>
              <div class="campo__grupo">
                <input class="campo__control" id="nueva-confirmar" name="confirmar" type="password" autocomplete="new-password" required aria-describedby="nueva-confirmar-error">
                <button class="campo__ojo" type="button" data-mostrar-contrasena="nueva-confirmar"></button>
              </div>
              <p class="campo__error" id="nueva-confirmar-error" hidden></p>
            </div>
            <p class="formulario__resultado formulario__resultado--error" role="alert" data-error-general hidden></p>
            <button class="boton boton--principal boton--grande boton--bloque" type="submit"><span>Guardar contraseña</span></button>
          </form>

          <div data-vencido hidden>
            <p class="campo__aviso">Este enlace venció o ya se usó. Los enlaces sirven una sola vez y por tiempo limitado.</p>
            <a class="boton boton--principal boton--grande boton--bloque acceso__boton" href="/ingresar"><span>Pedir un enlace nuevo</span></a>
          </div>

          <p class="acceso__alterno">¿La recordaste? <a href="/ingresar">Inicia sesión</a></p>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/js/nueva-contrasena.js"></script>
</body>
</html>
