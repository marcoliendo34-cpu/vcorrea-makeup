<!doctype html>
<html lang="es-VE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Iniciar sesión · Verónica Correa Makeup</title>
  <meta name="description" content="Ingresa a tu cuenta de alumna.">
  <meta name="theme-color" content="#FFFFFF">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap">

  <link rel="stylesheet" href="/css/estilos.css">
  <link rel="modulepreload" href="/js/componentes.js">
</head>
<body data-pagina="ingresar">
  <main id="contenido" tabindex="-1">
    <section class="acceso" aria-labelledby="titulo-ingresar">
      <div class="contenedor acceso__contenedor">
        <div class="acceso__caja">
          <p class="etiqueta">Alumnas</p>
          <h1 id="titulo-ingresar">Inicia sesión</h1>
          <p class="acceso__intro">Entra para solicitar tu inscripción y ver tus cursos.</p>
          <p class="acceso__curso" data-curso-contexto hidden></p>

          <form class="formulario" novalidate data-ingresar>
            <div class="campo">
              <label class="campo__etiqueta" for="ingresar-correo">Correo</label>
              <input class="campo__control" id="ingresar-correo" name="correo" type="email" inputmode="email" autocomplete="email" required aria-describedby="ingresar-correo-error">
              <p class="campo__error" id="ingresar-correo-error" hidden></p>
            </div>
            <div class="campo">
              <div class="campo__cabeza">
                <label class="campo__etiqueta" for="ingresar-contrasena">Contraseña</label>
                <button class="campo__enlace" type="button" data-olvido aria-controls="aviso-olvido">¿Olvidaste tu contraseña?</button>
              </div>
              <div class="campo__grupo">
                <input class="campo__control" id="ingresar-contrasena" name="contrasena" type="password" autocomplete="current-password" required aria-describedby="ingresar-contrasena-error">
                <button class="campo__ojo" type="button" data-mostrar-contrasena="ingresar-contrasena"></button>
              </div>
              <p class="campo__error" id="ingresar-contrasena-error" hidden></p>
              <p class="campo__aviso" id="aviso-olvido" role="status" data-aviso-olvido hidden>Disponible pronto. Mientras tanto, escríbele a Verónica por WhatsApp y te ayuda.</p>
            </div>
            <p class="formulario__resultado formulario__resultado--error" role="alert" data-error-general hidden></p>
            <button class="boton boton--principal boton--grande boton--bloque" type="submit"><span>Ingresar</span></button>
          </form>

          <p class="acceso__alterno">¿No tienes cuenta? <a href="/registro" data-enlace-registro>Crea una en 1 minuto</a></p>
          <p class="acceso__demo">Vista previa · Alumna: alumna@demo.com · Administradora: admin@demo.com · Contraseña: demo1234</p>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/js/ingresar.js"></script>
</body>
</html>
